<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Origo Control Panel</title>
<style>
:root{--bg:#0b0b0b;--panel:#141414;--line:#2a2a2a;--text:#f2f2ee;--muted:#9a9a94;--accent:#b07a4b;--ok:#4aa36a;--err:#d9534f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}
h1{font-size:25px;margin:0 0 6px;font-weight:600}
.muted{color:var(--muted);margin:0 0 16px}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 130px}
.top{position:sticky;top:0;z-index:20;background:rgba(11,11,11,.97);border-bottom:1px solid var(--line);padding:10px 14px}
.toprow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em}.brand span{color:var(--accent);font-weight:500}
.toolbtns{display:flex;gap:6px;flex-wrap:wrap}
.nav{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding:8px 0 2px;-webkit-overflow-scrolling:touch}
.pill,.tb{padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:#d6d6d0;background:transparent;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sep{align-self:center;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:0 4px}
.msg{padding:12px 14px;border-radius:8px;margin:0 0 12px;font-size:14px;white-space:pre-wrap}
.msg.ok{background:rgba(74,163,106,.15);border:1px solid var(--ok)}
.msg.err{background:rgba(217,83,79,.14);border:1px solid var(--err)}
.msg.info{background:rgba(176,122,75,.12);border:1px solid var(--accent)}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--text);cursor:pointer;text-align:left;font:inherit;width:100%}
.card b{display:block;font-size:17px;margin-bottom:2px}.card span{color:var(--muted);font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.row-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#191919;border-bottom:1px solid var(--line);flex-wrap:wrap}
.badge{flex:0 0 auto;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:600;padding:0 6px}
.rtitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rbtns{display:flex;gap:6px;margin-left:auto}
.rbtns button{height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#222;color:#eee;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.rbtns button b{font-size:16px;margin-right:3px}
.rbtns .del{color:#ff8a85;border-color:#6b2f2d;background:#2a1514}
@media (max-width:560px){.rbtns{width:100%}.rbtns button{flex:1}}
.rbody{padding:14px;display:grid;grid-template-columns:1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span.l{font-size:12px;color:var(--muted);letter-spacing:.04em}
.fld small{color:var(--muted);font-size:12px}
input[type=text],input[type=password],input[type=date],textarea,select{width:100%;background:#0f0f0f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit;font-size:16px}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.group{border:1px dashed var(--line);border-radius:10px;padding:10px}
.imgbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pvframe{width:200px;height:150px;flex:0 0 auto;border:1px dashed #3a3a3a;border-radius:8px;background:#0f0f0f;overflow:hidden;display:grid;place-items:center}
.pv{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.pv[hidden],.pvmsg[hidden]{display:none}
.pvmsg{color:var(--muted);font-size:13px;padding:8px;text-align:center}
.pvcap{color:#d6d6d0;font-size:13px;word-break:break-all}
@media (max-width:560px){.pvframe{width:100%;height:210px}}
.imgctl{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:#d6d6d0}
.chk input{width:20px;height:20px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:10px;padding:13px 20px;font:inherit;font-weight:600;cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--text);border-color:#555}
.btn.small{padding:8px 14px;min-height:38px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,11,11,.97);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.savebar .st{font-size:13px;color:var(--muted)}
.savebar .st.dirty{color:#f0c27a}
.login{max-width:420px;margin:8vh auto 0;padding:0 16px}
.login h1{letter-spacing:.14em}.login h1 span{color:var(--accent);font-weight:500}
.login .btn{width:100%;margin-top:6px}
.login .fld{margin-bottom:12px}
.addrow{margin:2px 0 16px}
.nested{margin-top:4px}
@media (min-width:760px){.cards{grid-template-columns:repeat(3,1fr)}.rbody{grid-template-columns:1fr 1fr}.fld.full{grid-column:1/-1}}

.ic{width:100%;height:100%;display:block}
.ic .f{fill:#55554f}.ic .a{fill:#b07a4b}.ic .l{fill:#8a8a84}.ic .s{stroke:#77776f;fill:none;stroke-width:1.5}
.ricon{width:46px;height:32px;flex:0 0 auto;background:#0f0f0f;border:1px solid var(--line);border-radius:6px;padding:2px}
.rbtns .pvbtn{color:#f0c27a;border-color:#5b4a2b;background:#241d10}
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.86);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.ovbox{background:#121212;border:1px solid var(--line);border-radius:14px;width:100%;max-width:760px;margin:auto 0}
.ovbox.wide{max-width:1180px}
.ovhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ovbody{padding:14px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);cursor:pointer;font:inherit}
.tile:hover,.tile.on{border-color:var(--accent);background:#1b1612}
.tile .tic{height:64px;background:#0b0b0b;border-radius:6px;padding:4px;border:1px solid #222}
.tile b{font-size:14px}.tile span{font-size:12px;color:var(--muted)}
.tthumb{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#0b0b0b;border:1px solid #222;border-radius:6px;padding:4px;min-height:64px;align-content:start}
.tthumb .ic{height:28px}
.tthumb.empty{display:grid;place-items:center;color:var(--muted);font-size:12px}
.wiz .fld{margin-bottom:12px}
.pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pvstage{background:#050505;border-radius:10px;padding:10px;display:flex;justify-content:center}
.pvstage iframe{border:1px solid var(--line);border-radius:8px;background:#080808;height:78vh;width:100%}
.pvstage.mob iframe{width:390px;max-width:100%}
.pill.on2{background:var(--accent);border-color:var(--accent);color:#fff}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}.tiles.t3{grid-template-columns:repeat(3,1fr)}}

.urow{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.urow input{width:22px;height:22px;flex:0 0 auto}
.upv{width:72px;height:54px;object-fit:cover;border-radius:6px;background:#0f0f0f;border:1px solid var(--line);flex:0 0 auto}
.uinfo{display:flex;flex-direction:column;min-width:0}.uinfo small{color:var(--muted);word-break:break-all}

.drop{display:block;border:2px dashed #3a3a3a;border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;color:#d6d6d0;background:#0f0f0f;margin-bottom:14px}
.drop:hover,.drop.over{border-color:var(--accent);background:#1b1612}
.drop input{display:none}
.drop b{display:block;font-size:16px;margin-bottom:4px}.drop span{color:var(--muted);font-size:13px}
.frow{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.frow.off{opacity:.55;cursor:default}
.frow input{width:20px;height:20px;flex:0 0 auto}
.fpath{min-width:0;flex:1;display:flex;flex-direction:column}.fpath b{font-size:14px;word-break:break-all}.fpath small{color:var(--muted);font-size:12px;word-break:break-all}
.tag{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid}
.tag.new{color:#7bd49a;border-color:#2f6b45;background:rgba(74,163,106,.12)}
.tag.chg{color:#f0c27a;border-color:#6d5628;background:rgba(240,194,122,.1)}
.tag.same{color:#9a9a94;border-color:#3a3a3a}
.tag.prot{color:#ff8a85;border-color:#6b2f2d;background:#2a1514}
.cbox{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px;margin-top:16px}
.cbox h2{margin:0 0 6px;font-size:20px;font-weight:600}
.cbox input[type=text],.cbox textarea{margin-bottom:10px}
.rad{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:14px;color:#d6d6d0;cursor:pointer}
.rad input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}
.rad code{background:#1d2530;color:#9ecbff;border-radius:6px;padding:1px 6px;font-size:13px}
.cbtns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn.green{background:#238636;border-color:#2ea043}
.btn.cancel{background:#1a1a1a;color:#ff8a85;border-color:#444}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var API = 'https://api.github.com';
  var CFG_KEY = 'origo_control_cfg';

  /* ---------------------------------------------------------------- helpers */
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) { Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    }); }
    (kids || []).forEach(function (c) { if (c == null) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function slugify(s) { s = String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); return (s || 'item').slice(0, 40); }
  function stamp() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function b64enc(str) { var bytes = new TextEncoder().encode(str), bin = ''; for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
  function b64dec(b64) { var bin = atob(String(b64).replace(/\s/g, '')), bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function splitParas(s) { return String(s || '').replace(/\r/g, '').split(/\n\s*\n/).map(function (p) { return p.replace(/\s*\n\s*/g, ' ').trim(); }).filter(Boolean); }
  function isImgPath(p) { return typeof p === 'string' && /^assets\/images\/[A-Za-z0-9_\/-]+\.(jpg|jpeg|png|webp)$/.test(p) && p.indexOf('..') < 0; }
  function gather(v, out) { if (Array.isArray(v)) v.forEach(function (x) { gather(x, out); }); else if (v && typeof v === 'object') Object.keys(v).forEach(function (k) { gather(v[k], out); }); else if (isImgPath(v)) out[v] = true; return out; }

  /* ---------------------------------------------------------------- state */
  var CFG = null;
  var S = { files: {}, pending: {}, preview: {}, dirty: {}, section: 'dash', busy: false };
  var app = document.getElementById('app');

  /* ---------------------------------------------------------------- GitHub API */
  function ghUrl(path) { return API + '/repos/' + CFG.owner + '/' + CFG.repo + '/contents/' + path.split('/').map(encodeURIComponent).join('/'); }
  function headers(extra) { var h = { 'Authorization': 'Bearer ' + CFG.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; }); return h; }
  function friendly(status, j, what) {
    var m = (j && j.message) ? j.message : '';
    if (status === 401) return 'GitHub says the token is wrong or expired. Log out and enter a new token.';
    if (status === 403) return 'GitHub refused (' + (m || 'forbidden') + '). Check that the token has "Contents: Read and write" for this repo, or wait a minute if you hit a rate limit.';
    if (status === 404) return 'Not found: ' + what + '. Check owner/repo/branch names, and that the token can access this repo.';
    if (status === 409 || status === 422) return 'The file changed on GitHub since you opened this panel (' + (m || 'conflict') + '). Press "Reload from GitHub", then make your change again.';
    return 'GitHub error ' + status + (m ? ': ' + m : '') + ' (' + what + ')';
  }
  async function gh(method, path, body) {
    var url = method === 'GET' ? ghUrl(path) + '?ref=' + encodeURIComponent(CFG.branch) + '&_=' + Date.now() : ghUrl(path);
    var r;
    try { r = await fetch(url, { method: method, headers: headers(), body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
    catch (e) { throw new Error('Cannot reach GitHub. Check your internet connection.'); }
    var j = {}; try { j = await r.json(); } catch (e) { j = {}; }
    if (!r.ok) { var err = new Error(friendly(r.status, j, path)); err.status = r.status; throw err; }
    return j;
  }
  /* preview: always read the CURRENT file from the repo (not the live site), so it is never stale */
  var blobCache = {};
  function repoImage(path) {
    if (S.preview[path]) return Promise.resolve(S.preview[path]);
    if (blobCache[path]) return blobCache[path];
    var pr = fetch(ghUrl(path) + '?ref=' + encodeURIComponent(CFG.branch), { headers: headers({ 'Accept': 'application/vnd.github.raw+json' }), cache: 'no-store' })
      .then(function (r) { if (!r.ok) { var e = new Error('missing'); e.status = r.status; throw e; } return r.blob(); })
      .then(function (b) { return URL.createObjectURL(b); });
    blobCache[path] = pr;
    pr.catch(function () { delete blobCache[path]; });
    return pr;
  }
  async function loadFile(name) {
    var path = 'assets/js/' + name;
    if (S.files[path]) return S.files[path];
    var sec = SECTIONS.filter(function (s) { return s.file === name; })[0];
    var j;
    try { j = await gh('GET', path); }
    catch (er) {
      if (er.status === 404 && sec.optional) {
        var nf = { path: path, sha: undefined, header: '/* Managed by the control panel. Keep VALID JSON if you edit by hand. */\n\n', varName: sec.varName, data: (sec.kind === 'list' ? [] : {}), isNew: true };
        nf.origImgs = {}; S.files[path] = nf; return nf;
      }
      throw er;
    }
    var text;
    if (j.content) text = b64dec(j.content);
    else { var r = await fetch(ghUrl(path) + '?ref=' + encodeURIComponent(CFG.branch), { headers: headers({ 'Accept': 'application/vnd.github.raw+json' }), cache: 'no-store' }); text = await r.text(); }
    var re = new RegExp('^window\\.' + sec.varName + '\\s*=', 'm'), m = re.exec(text);
    if (!m) throw new Error(name + ' does not contain window.' + sec.varName);
    var rest = text.slice(m.index + m[0].length), end = rest.lastIndexOf(';');
    var data;
    try { data = JSON.parse((end < 0 ? rest : rest.slice(0, end)).trim()); }
    catch (e) { throw new Error(name + ' has a syntax error and cannot be edited here: ' + e.message); }
    var f = { path: path, sha: j.sha, header: text.slice(0, m.index), varName: sec.varName, data: data };
    f.origImgs = gather(data, {});
    S.files[path] = f;
    return f;
  }

  /* ---------------------------------------------------------------- image processing */
  function processImage(file) {
    return new Promise(function (res, rej) {
      if (file.size > 25 * 1024 * 1024) { rej(new Error('Photo is larger than 25 MB.')); return; }
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight, max = 1600, nw = w > max ? max : w, nh = Math.round(h * nw / w);
        var c = document.createElement('canvas'); c.width = nw; c.height = nh;
        var cx = c.getContext('2d'), png = file.type === 'image/png';
        if (!png) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, nw, nh); }
        cx.drawImage(img, 0, 0, nw, nh);
        var d = c.toDataURL(png ? 'image/png' : 'image/jpeg', 0.85);
        URL.revokeObjectURL(url);
        res({ b64: d.split(',')[1], dataUrl: d, ext: png ? 'png' : 'jpg' });
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('That file is not a readable image (use JPG, PNG or WebP).')); };
      img.src = url;
    });
  }

  /* ---------------------------------------------------------------- schema */
  var T = { text: 'text', title: 'title' };
  var STATS = { key: 'stats', label: 'Highlights (up to 3: big value + small label)', type: 'stats' };
  var BTN = function (key, label) { return { key: key, label: label, type: 'group', fields: [{ key: 'text', label: 'Button text', type: 'text' }, { key: 'link', label: 'Link (page or https://…)', type: 'url' }] }; };
  var TITLE_HINT = 'New line = line break. Put *stars* around a word to make it outlined/accent colour.';

  /* ---------------------------------------------------------------- block library */
  var ICON = {
    hero: '<rect class="f" x="2" y="2" width="60" height="40" rx="3" opacity=".4"/><rect class="a" x="8" y="12" width="32" height="6"/><rect class="l" x="8" y="22" width="24" height="3"/><rect class="a" x="8" y="30" width="14" height="6" rx="1"/>',
    text: '<rect class="a" x="8" y="6" width="26" height="5"/><rect class="l" x="8" y="16" width="48" height="3"/><rect class="l" x="8" y="23" width="44" height="3"/><rect class="l" x="8" y="30" width="48" height="3"/><rect class="l" x="8" y="37" width="30" height="3"/>',
    imagetext: '<rect class="f" x="4" y="6" width="26" height="32" rx="2"/><circle class="l" cx="12" cy="15" r="3"/><rect class="a" x="36" y="9" width="22" height="5"/><rect class="l" x="36" y="19" width="24" height="3"/><rect class="l" x="36" y="26" width="20" height="3"/><rect class="a" x="36" y="33" width="12" height="5" rx="1"/>',
    rows: '<rect class="f" x="3" y="3" width="24" height="16" rx="2"/><rect class="a" x="32" y="6" width="22" height="4"/><rect class="l" x="32" y="13" width="26" height="3"/><rect class="f" x="37" y="25" width="24" height="16" rx="2"/><rect class="a" x="6" y="28" width="22" height="4"/><rect class="l" x="6" y="35" width="26" height="3"/>',

  function label(fd, extra) { return el('span', { class: 'l', text: fd.label }); }

  var FULL = { textarea: 1, title: 1, paras: 1, tags: 1, group: 1, stats: 1, list: 1, image: 1 };

  function field(fd, obj, ctx) {
    var k = fd.key, t = fd.type, w = el('div', { class: 'fld' + (FULL[t] ? ' full' : '') }), inp;
    function set(v) { obj[k] = v; touch(ctx.file); if (ctx.onInput) ctx.onInput(); }
    if (t === 'text' || t === 'url') {
      inp = el('input', { type: 'text', value: obj[k] == null ? '' : obj[k], placeholder: fd.ph || '', autocomplete: 'off' });
      inp.addEventListener('input', function () { set(inp.value); });
      w.appendChild(label(fd)); w.appendChild(inp); if (hint(fd)) w.appendChild(hint(fd));
    } else if (t === 'date') {
      inp = el('input', { type: 'date', value: obj[k] || '' });
      inp.addEventListener('input', function () { set(inp.value); });
      w.appendChild(label(fd)); w.appendChild(inp); if (hint(fd)) w.appendChild(hint(fd));
    } else if (t === 'textarea' || t === 'title') {
      inp = el('textarea', { rows: fd.rows || (t === 'title' ? 2 : 4), placeholder: fd.ph || '' }); inp.value = obj[k] == null ? '' : obj[k];
      inp.addEventListener('input', function () { set(inp.value); });
      w.appendChild(label(fd)); w.appendChild(inp); if (hint(fd)) w.appendChild(hint(fd));
    } else if (t === 'paras') {
      inp = el('textarea', { rows: 6 }); inp.value = Array.isArray(obj[k]) ? obj[k].join('\n\n') : (obj[k] || '');
      inp.addEventListener('input', function () { set(splitParas(inp.value)); });
      w.appendChild(label(fd)); w.appendChild(inp);
    } else if (t === 'tags') {
      inp = el('input', { type: 'text', value: Array.isArray(obj[k]) ? obj[k].join(', ') : (obj[k] || '') });
      inp.addEventListener('input', function () { set(inp.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean)); });
      w.appendChild(label(fd)); w.appendChild(inp);
    } else if (t === 'select') {
      inp = el('select', {}, Object.keys(fd.options).map(function (ov) { return el('option', { value: ov, text: fd.options[ov] }); }));
      inp.value = obj[k] && fd.options[obj[k]] ? obj[k] : Object.keys(fd.options)[0];
      if (!obj[k]) obj[k] = inp.value;
      inp.addEventListener('change', function () { set(inp.value); if (fd.rerender && ctx.redraw) ctx.redraw(); });
      w.appendChild(label(fd)); w.appendChild(inp);
    } else if (t === 'bool') {

  async function renderUpdate(view) {
    view.appendChild(el('h1', { text: 'Code update' }));
    view.appendChild(el('p', { class: 'muted', text: 'Choose a website update ZIP. The panel unpacks it and lists every file. When you press "Commit changes", everything is saved to GitHub as ONE commit, the same as GitHub\'s own "Upload files" page. Files are only added or replaced, never deleted.' }));
    var area = el('div'); view.appendChild(area);

    function protReason(path, exists) {
      if (!exists) return '';
      if (/^assets\/js\/[^\/]+-data\.js$/.test(path)) return 'Your content (edited in this panel)';
      if (path === 'CNAME') return 'Your domain setting';
      if (path === 'sitemap.xml') return 'Kept up to date by this panel';
      if (/^assets\/images\//.test(path)) return 'Your uploaded photo';
      return '';
    }
    function offReason(path) { return /(^|\/)Code\.gs$/i.test(path) ? 'Apps Script file, not for GitHub' : ''; }
    function kb(n) { return n < 1024 ? n + ' B' : Math.round(n / 1024) + ' KB'; }

    function showPicker(m) {
      area.innerHTML = '';
      if (m) area.appendChild(el('div', { class: 'msg ' + m.kind, text: m.text }));
      var inp = el('input', { type: 'file', accept: '.zip,application/zip,application/x-zip-compressed' });
      var drop = el('label', { class: 'drop' }, [el('b', { text: 'Choose the update ZIP' }), el('span', { text: 'Tap to select a .zip file, or drop it here' }), inp]);
      ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
      drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handle(f); });
      inp.addEventListener('change', function () { if (inp.files && inp.files[0]) handle(inp.files[0]); });
      area.appendChild(drop);
    }

    async function handle(file) {
      area.innerHTML = ''; area.appendChild(el('p', { class: 'muted', text: 'Reading ' + file.name + ' and checking it against GitHub…' }));
      try {
        var parsed = await readZip(file);
        var snap = await repoSnapshot();
        review(file, parsed, snap);
      } catch (e) { showPicker({ kind: 'err', text: e.message }); }
    }

    function review(file, parsed, snap) {
      area.innerHTML = '';
      var files = parsed.files.map(function (f) {
        var cur = snap.map[f.path], exists = !!cur, same = exists && !!f.sha && cur.sha === f.sha;
        var prot = same ? '' : protReason(f.path, exists), off = same ? '' : offReason(f.path);
        return { path: f.path, bytes: f.bytes, status: same ? 'same' : (exists ? 'chg' : 'new'), prot: prot, off: off, on: !same && !prot && !off, dis: same };
      });
      var nNew = files.filter(function (f) { return f.status === 'new'; }).length, nChg = files.filter(function (f) { return f.status === 'chg'; }).length, nSame = files.filter(function (f) { return f.status === 'same'; }).length;
      area.appendChild(el('div', { class: 'msg info', text: file.name + ' · ' + files.length + ' files · ' + nNew + ' new · ' + nChg + ' changed · ' + nSame + ' already identical on GitHub.' + (parsed.stripped ? '\nThe outer folder "' + parsed.stripped + '/" inside the ZIP was ignored, so the files go to the top of your repository.' : '') + (parsed.ignored ? '\n' + parsed.ignored + ' system file(s) skipped.' : '') + (snap.truncated ? '\nYour repository is very large, so some "New/Changed" labels may be inaccurate.' : '') }));
      if (parsed.bad.length) area.appendChild(el('div', { class: 'msg err', text: 'Skipped (cannot be uploaded):\n' + parsed.bad.join('\n') }));
      if (files.some(function (f) { return f.prot; })) area.appendChild(el('div', { class: 'msg info', text: 'Files marked PROTECTED already exist on GitHub and hold your own content, so they are left UNTICKED. Tick one only if you really want the ZIP version to replace yours.' }));
      if (!files.length) { showPicker({ kind: 'err', text: 'Nothing in this ZIP can be uploaded.' }); return; }

      var listEl = el('div'), summary = el('p', { class: 'muted', style: 'margin:0 0 10px' }), commitBtn;
      function upd() {
        var n = files.filter(function (f) { return f.on; }).length;
        summary.textContent = n ? (n + ' file' + (n === 1 ? '' : 's') + ' will be committed as one commit.') : 'Tick at least one file to commit.';
        if (commitBtn) commitBtn.disabled = !n || S.busy;
      }
      files.forEach(function (f) {
        var cb = el('input', { type: 'checkbox' }); cb.checked = f.on; cb.disabled = f.dis;
        var parts = f.path.split('/'), name = parts.pop();
        var tag = f.prot ? el('span', { class: 'tag prot', text: 'PROTECTED' }) : (f.off ? el('span', { class: 'tag same', text: 'SKIPPED' }) : el('span', { class: 'tag ' + f.status, text: f.status === 'new' ? 'NEW' : f.status === 'chg' ? 'CHANGED' : 'SAME' }));
        var row = el('label', { class: 'frow' + (f.dis ? ' off' : '') }, [cb, el('span', { class: 'fpath' }, [el('b', { text: name }), el('small', { text: (parts.length ? parts.join('/') + '/ · ' : '') + kb(f.bytes.length) + (f.prot ? ' · ' + f.prot : '') + (f.off ? ' · ' + f.off : '') })]), tag]);
        cb.addEventListener('change', function () { f.on = cb.checked; upd(); });
        f.cb = cb; listEl.appendChild(row);
      });
      var tools = el('div', { style: 'display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap' }, [
        el('button', { type: 'button', class: 'tb', text: 'Tick all new + changed', onclick: function () { files.forEach(function (f) { if (!f.dis && !f.prot && !f.off) { f.on = true; f.cb.checked = true; } }); upd(); } }),
        el('button', { type: 'button', class: 'tb', text: 'Untick all', onclick: function () { files.forEach(function (f) { f.on = false; f.cb.checked = false; }); upd(); } })
      ]);
      area.appendChild(tools); area.appendChild(listEl);

      /* ---- commit box (same layout as GitHub's "Commit changes") ---- */
      var d = new Date(), p2 = function (n) { return String(n).padStart(2, '0'); };
      var title = el('input', { type: 'text', placeholder: 'Add files via upload', autocomplete: 'off' });
      var desc = el('textarea', { rows: 4, placeholder: 'Add an optional extended description…' });
      var mDirect = el('input', { type: 'radio', name: 'cmode', value: 'direct' }); mDirect.checked = true;
      var mBranch = el('input', { type: 'radio', name: 'cmode', value: 'branch' });
      var bname = el('input', { type: 'text', value: 'update-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()), autocomplete: 'off', autocapitalize: 'off' });
      var bwrap = el('div', { style: 'margin:0 0 6px 28px', hidden: true }, [bname]);
      function sync() { bwrap.hidden = !mBranch.checked; }
      mDirect.addEventListener('change', sync); mBranch.addEventListener('change', sync);
      var prog = el('p', { class: 'muted', style: 'margin:10px 0 0' });
      commitBtn = el('button', { type: 'button', class: 'btn green', text: 'Commit changes', onclick: commit });
      var cancelBtn = el('button', { type: 'button', class: 'btn cancel', text: 'Cancel', onclick: function () { showPicker(); } });
      area.appendChild(el('div', { class: 'cbox' }, [
        el('h2', { text: 'Commit changes' }), summary, title, desc,
        el('label', { class: 'rad' }, [mDirect, el('span', { html: 'Commit directly to the <code>' + CFG.branch.replace(/[<>&"]/g, '') + '</code> branch.' })]),
        el('label', { class: 'rad' }, [mBranch, el('span', { html: 'Create a <b>new branch</b> for this commit and start a pull request.' })]), bwrap,
        el('div', { class: 'cbtns' }, [commitBtn, cancelBtn]), prog
      ]));
      upd();

      async function commit() {
        var sel = files.filter(function (f) { return f.on; });
        if (!sel.length || S.busy) return;
        var prot = sel.filter(function (f) { return f.prot; });
        if (prot.length && !confirm('You ticked ' + prot.length + ' PROTECTED file(s). They will be REPLACED by the versions inside the ZIP:\n\n' + prot.map(function (f) { return f.path; }).join('\n') + '\n\nContinue?')) return;
        var asBranch = mBranch.checked, newName = bname.value.trim();
        if (asBranch && (!/^[A-Za-z0-9][A-Za-z0-9._\/-]{0,80}$/.test(newName) || /\.\.|\/\/|\/$|\.lock$/.test(newName))) { alert('Branch name: use letters, numbers, dashes and dots only (for example update-1).'); return; }
        var msg = (title.value.trim() || 'Add files via upload'), ext = desc.value.trim(); if (ext) msg += '\n\n' + ext;
        S.busy = true; refreshBar(); commitBtn.disabled = true; cancelBtn.disabled = true;
        var committed = false;
        try {
          prog.textContent = 'Checking GitHub…';
          var snap2 = await repoSnapshot();
          for (var i = 0; i < sel.length; i++) {
            prog.textContent = 'Uploading file ' + (i + 1) + ' of ' + sel.length + '…';
            sel[i].blob = (await ghApi('POST', 'git/blobs', { content: bytesToB64(sel[i].bytes), encoding: 'base64' })).sha;
          }
          prog.textContent = 'Creating the commit…';
          var attempt = 0, newSha;
          for (;;) {
            var tr = await ghApi('POST', 'git/trees', { base_tree: snap2.treeSha, tree: sel.map(function (f) { var cur = snap2.map[f.path]; return { path: f.path, mode: (cur && cur.mode) || '100644', type: 'blob', sha: f.blob }; }) });
            var cm = await ghApi('POST', 'git/commits', { message: msg, tree: tr.sha, parents: [snap2.headSha] });
            newSha = cm.sha;
            if (asBranch) {
              try { await ghApi('POST', 'git/refs', { ref: 'refs/heads/' + newName, sha: newSha }); }
              catch (e) { if (e.status === 422) throw new Error('A branch called "' + newName + '" already exists. Type a different branch name and press Commit changes again.'); throw e; }
              committed = true; break;
            }
            try { await ghApi('PATCH', 'git/refs/heads/' + refPath(), { sha: newSha, force: false }); committed = true; break; }
            catch (e2) { if (e2.status === 422 && attempt === 0) { attempt++; prog.textContent = 'GitHub changed while uploading, retrying…'; snap2 = await repoSnapshot(); continue; } throw e2; }
          }
          /* forget cached copies so the panel re-reads what was just committed */
          sel.forEach(function (f) { if (/^assets\/js\//.test(f.path) && !S.dirty[f.path]) delete S.files[f.path]; });
          blobCache = {};
          var url = 'https://github.com/' + CFG.owner + '/' + CFG.repo;
          var selfUpd = sel.some(function (f) { return f.path === 'origo-control.html'; });
          area.innerHTML = '';
          var ok = el('div', { class: 'msg ok' }, [
            '✓ ' + sel.length + ' file' + (sel.length === 1 ? '' : 's') + ' committed ' + (asBranch ? 'to the new branch "' + newName + '"' : 'to ' + CFG.branch) + ' as one commit.\n',
            el('a', { href: url + '/commit/' + newSha, target: '_blank', rel: 'noopener', text: 'View the commit on GitHub ↗' })
          ]);
          area.appendChild(ok);
          if (asBranch) area.appendChild(el('div', { class: 'msg info' }, ['The live site is not changed yet. Open the pull request and merge it:\n', el('a', { href: url + '/compare/' + encodeURIComponent(CFG.branch) + '...' + encodeURIComponent(newName) + '?expand=1', target: '_blank', rel: 'noopener', text: 'Open pull request ↗' })]));
          else area.appendChild(el('div', { class: 'msg info', text: 'The live site updates in 1–2 minutes. Then refresh the website with Ctrl+Shift+R.' + (selfUpd ? '\nThis control panel was updated too: reload this page (Ctrl+Shift+R) after 1–2 minutes to use the new version.' : '') }));
          area.appendChild(el('button', { type: 'button', class: 'btn ghost', text: 'Upload another ZIP', onclick: function () { showPicker(); } }));
        } catch (e) {
          prog.textContent = '';
          commitBtn.disabled = false; cancelBtn.disabled = false;
          area.insertBefore(el('div', { class: 'msg err', text: (committed ? 'The commit WAS saved to GitHub, but this page hit a problem showing the result: ' : 'Nothing was changed on your live site.\n') + e.message }), area.firstChild);
          window.scrollTo(0, 0);
        } finally { S.busy = false; refreshBar(); }
      }
    }
    showPicker();
  }

  /* ---------------------------------------------------------------- views */
  var main;
  function shell() {
    app.innerHTML = '';
    var groups = [], seen = {};
    SECTIONS.forEach(function (s) { if (!seen[s.group]) { seen[s.group] = 1; groups.push(s.group); } });
    var nav = el('div', { class: 'nav' }, [el('button', { class: 'pill' + (S.section === 'dash' ? ' on' : ''), text: 'Dashboard', onclick: function () { go('dash'); } })]);
    groups.forEach(function (g) {
      nav.appendChild(el('span', { class: 'sep', text: g }));
      SECTIONS.filter(function (s) { return s.group === g; }).forEach(function (s) { nav.appendChild(el('button', { class: 'pill' + (S.section === s.id ? ' on' : ''), text: s.title, onclick: function () { go(s.id); } })); });
    });
    nav.appendChild(el('span', { class: 'sep', text: 'Tools' })); nav.appendChild(el('button', { class: 'pill' + (S.section === 'unused' ? ' on' : ''), text: 'Unused photos', onclick: function () { go('unused'); } }));
    nav.appendChild(el('button', { class: 'pill' + (S.section === 'update' ? ' on' : ''), text: 'Code update', onclick: function () { go('update'); } }));
    var top = el('div', { class: 'top' }, [
      el('div', { class: 'toprow' }, [
        el('div', { class: 'brand', html: 'ORIGO <span>Control</span>' }),
        el('div', { class: 'toolbtns' }, [
          el('a', { class: 'tb', href: './index.html', target: '_blank', rel: 'noopener', text: 'View site ↗' }),
          el('button', { class: 'tb', text: 'Reload from GitHub', onclick: reloadAll }),
          el('button', { class: 'tb', text: 'Log out', onclick: logout })
        ])
      ]), nav
    ]);
    main = el('main', { class: 'wrap' }, [el('div', { id: 'flash' }), el('div', { id: 'view' })]);
    var bar = el('div', { class: 'savebar' }, [el('span', { class: 'st', id: 'st', text: 'No unsaved changes' }), el('button', { class: 'btn', id: 'savebtn', text: 'Save to GitHub', disabled: true, onclick: saveAll })]);
    app.appendChild(top); app.appendChild(main); app.appendChild(bar);
  }
  function go(id) { S.section = id; shell(); renderSection(id); }
  async function renderSection(id, keepFlash) {
    var view = document.getElementById('view'); if (!view) { shell(); view = document.getElementById('view'); }
    if (!keepFlash) note('', '');
    view.innerHTML = '';
    if (id === 'dash') {
      view.appendChild(el('h1', { text: 'Dashboard' }));
      view.appendChild(el('p', { class: 'muted', text: 'Pick what you want to change, edit it, then press "Save to GitHub". The live site updates in 1–2 minutes.' }));
      var cards = el('div', { class: 'cards' });
      SECTIONS.forEach(function (s) { cards.appendChild(el('button', { class: 'card', onclick: function () { go(s.id); } }, [el('b', { text: s.title }), el('span', { text: s.intro })])); });
      cards.appendChild(el('button', { class: 'card', onclick: function () { go('unused'); } }, [el('b', { text: 'Unused photos' }), el('span', { text: 'Find photos nothing uses any more and delete them.' })]));
      cards.appendChild(el('button', { class: 'card', onclick: function () { go('update'); } }, [el('b', { text: 'Code update' }), el('span', { text: 'Upload a website update ZIP, review the files, and commit it to GitHub in one click.' })]));
      view.appendChild(cards);
      view.appendChild(el('div', { class: 'box', style: 'margin-top:18px' }, [el('b', { text: 'Tips' }), el('p', { class: 'muted', style: 'margin:6px 0 0', text: 'Titles: a new line makes a line break, and *stars* around a word make it outlined. Photos are resized automatically before upload. Every save is a GitHub commit, so older versions can always be restored from the repository history.' })]));
      refreshBar(); return;
    }
    if (id === 'unused') { await renderUnused(view); refreshBar(); return; }
    if (id === 'update') { await renderUpdate(view); refreshBar(); return; }
    var sec = secById(id);
    view.appendChild(el('h1', { text: sec.title })); view.appendChild(el('p', { class: 'muted', text: sec.intro }));
    view.appendChild(el('div', { style: 'margin:-6px 0 14px' }, [el('button', { type: 'button', id: 'discardbtn', class: 'tb', text: '↺ Discard unsaved changes', disabled: !S.dirty['assets/js/' + sec.file], onclick: function () {
      if (!confirm('Discard ALL unsaved changes in this section (and other sections that share the same data file) and reload it from GitHub?')) return;
      var path = 'assets/js/' + sec.file; delete S.files[path]; S.dirty[path] = false; renderSection(id);
    } })]));
    var f;
    try { f = await loadFile(sec.file); } catch (e) { view.appendChild(el('div', { class: 'msg err', text: e.message })); return; }
    if (S.section !== id) return;
    var ctx = { file: sec.file, dir: sec.dir };
    if (sec.id === 'pages') { try { await loadFile('projects-data.js'); } catch (e0) { /* optional */ } try { await loadFile('site-data.js'); } catch (e1) { /* optional */ } try { await loadFile('events-data.js'); } catch (e2) { /* optional */ } if (S.section !== id) return; }
    if (sec.id === 'projects' && Array.isArray(f.data) && !f.data.length) {
      var imp = el('button', { type: 'button', class: 'btn', text: 'Import NDA as the first project', onclick: async function () {
        try {
          var nf0 = await loadFile('nda-data.js'), n0 = nf0.data || {};
          f.data.push({ title: n0.title || 'NDA', id: slugify(n0.title || 'nda'), subtitle: n0.subtitle || '', intro: n0.intro || '', logo: n0.logo === undefined ? 'assets/images/nda/nda-logo.png' : n0.logo, cols: 'c3', numbers: true, events: clone(n0.events || []) });
          touch(sec.file); renderSection(id, true);
        } catch (e3) { alert(e3.message); }
      } });
      view.appendChild(el('div', { class: 'msg info' }, [el('div', { text: 'No projects yet, so the old NDA section is still shown on the Events page. To manage NDA here (and add Collab and others), import it first.' }), el('div', { style: 'margin-top:10px' }, [imp])]));
    }
    if (sec.kind === 'object') {
      if (!f.data[sec.sub] || typeof f.data[sec.sub] !== 'object') f.data[sec.sub] = {};
      var card = el('div', { class: 'row-card' }, [el('div', { class: 'rbody' })]); var rb = card.firstChild;
      sec.fields.forEach(function (fd) { rb.appendChild(field(fd, f.data[sec.sub], ctx)); });
      view.appendChild(card);
    } else {
      if (sec.kind === 'listobj') {
        var hb = el('div', { class: 'row-card' }, [el('div', { class: 'rbody' })]);
        sec.head.forEach(function (fd) { hb.firstChild.appendChild(field(fd, f.data, ctx)); });
        view.appendChild(hb);
        if (!Array.isArray(f.data[sec.list])) f.data[sec.list] = [];
        view.appendChild(listEditor(f.data[sec.list], sec, ctx, false));
      } else {
        view.appendChild(listEditor(f.data, sec, ctx, false));
      }
    }
    refreshBar();
  }

  /* ---------------------------------------------------------------- login */
  function saveCfg(remember) {
    var s = JSON.stringify(CFG);
    try { localStorage.removeItem(CFG_KEY); sessionStorage.removeItem(CFG_KEY); (remember ? localStorage : sessionStorage).setItem(CFG_KEY, s); } catch (e) { /* ignore */ }
  }
  function readCfg() { try { var s = localStorage.getItem(CFG_KEY) || sessionStorage.getItem(CFG_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function logout() {
    if (dirtyCount() && !confirm('You have unsaved changes. Log out anyway?')) return;
    try { localStorage.removeItem(CFG_KEY); sessionStorage.removeItem(CFG_KEY); } catch (e) { /* ignore */ }
    S.files = {}; S.pending = {}; S.dirty = {}; blobCache = {}; CFG = null; showLogin();
  }
  async function reloadAll() {
    if (dirtyCount() && !confirm('Discard unsaved changes and reload from GitHub?')) return;
    S.files = {}; S.pending = {}; S.dirty = {}; blobCache = {}; go(S.section);
  }
  function showLogin(msg) {
    var prev = readCfg() || {};
    var inp = {
      owner: el('input', { type: 'text', value: prev.owner || '', placeholder: 'e.g. my-github-username', autocapitalize: 'off', autocomplete: 'off' }),
      repo: el('input', { type: 'text', value: prev.repo || '', placeholder: 'e.g. origo-website', autocapitalize: 'off', autocomplete: 'off' }),
      branch: el('input', { type: 'text', value: prev.branch || 'main', autocapitalize: 'off', autocomplete: 'off' }),
      token: el('input', { type: 'password', value: prev.token || '', placeholder: 'github_pat_…', autocomplete: 'off' })
    };
    var rem = el('input', { type: 'checkbox' }); rem.checked = !!localStorage.getItem(CFG_KEY);
    var out = el('div');
    if (msg) out.appendChild(el('div', { class: 'msg err', text: msg }));
    var btn = el('button', { class: 'btn', type: 'submit', text: 'Connect' });
    var form = el('form', {}, [
      el('div', { class: 'fld' }, [el('span', { class: 'l', text: 'GitHub username (owner)' }), inp.owner]),
      el('div', { class: 'fld' }, [el('span', { class: 'l', text: 'Repository name' }), inp.repo]),
      el('div', { class: 'fld' }, [el('span', { class: 'l', text: 'Branch' }), inp.branch]),
      el('div', { class: 'fld' }, [el('span', { class: 'l', text: 'Access token (fine-grained, this repo only)' }), inp.token]),
      el('label', { class: 'chk', style: 'margin-bottom:12px' }, [rem, 'Remember on this device']), btn
    ]);
    form.addEventListener('submit', async function (e) {
      e.preventDefault(); btn.disabled = true; btn.textContent = 'Connecting…'; out.innerHTML = '';
      CFG = { owner: inp.owner.value.trim(), repo: inp.repo.value.trim(), branch: inp.branch.value.trim() || 'main', token: inp.token.value.trim() };
      try {
        var r = await fetch(API + '/repos/' + CFG.owner + '/' + CFG.repo, { headers: headers(), cache: 'no-store' });
        var j = await r.json().catch(function () { return {}; });
        if (!r.ok) throw new Error(friendly(r.status, j, CFG.owner + '/' + CFG.repo));
        if (j.permissions && j.permissions.push === false) throw new Error('This token can read the repo but cannot write. Give it "Contents: Read and write".');
        saveCfg(rem.checked);
        S.files = {}; S.pending = {}; S.dirty = {}; S.section = 'dash'; go('dash');
      } catch (er) { out.innerHTML = ''; out.appendChild(el('div', { class: 'msg err', text: er.message })); btn.disabled = false; btn.textContent = 'Connect'; CFG = null; }
    });
    app.innerHTML = '';
    app.appendChild(el('div', { class: 'login' }, [el('h1', { html: 'ORIGO <span>Control</span>' }), el('p', { class: 'muted', text: 'Connect to your GitHub repository to edit the website.' }), out, form,
      el('p', { class: 'muted', style: 'margin-top:16px;font-size:13px', text: 'Your token stays in this browser only. It is never saved in the website files.' })]));
  }

  CFG = readCfg();
  if (CFG && CFG.owner && CFG.repo && CFG.token) { S.section = 'dash'; go('dash'); } else { CFG = null; showLogin(); }
})();
